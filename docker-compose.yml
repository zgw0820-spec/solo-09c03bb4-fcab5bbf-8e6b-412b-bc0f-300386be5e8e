services:
  gateway:
    build: ./gateway
    environment:
      GATEWAY_DB: /data/gateway.db
      GATEWAY_EXECUTION_DELAY: "1.5"
    volumes:
      - gateway-data:/data
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/healthz',timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  web:
    build: ./web
    environment:
      OPS_DB: /data/ops.db
      GATEWAY_URL: http://gateway:8001
    volumes:
      - web-data:/data
    ports:
      - "8000:8000"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  web-data:
  gateway-data:
